version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartmaint-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartmaint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartmaint123}
      POSTGRES_DB: ${POSTGRES_DB:-smartmaint_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - smartmaint-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartmaint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartmaint-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartmaint-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Vector database for RAG (PDF manual chunks)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartmaint-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smartmaint-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/collections > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  # Tesseract + Poppler are installed inside the image via backend/Dockerfile (Alpine apk)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartmaint-backend
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-smartmaint}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-smartmaint123}
      DATABASE_NAME: ${POSTGRES_DB:-smartmaint_db}
      # Schema via migrations only — never auto-sync (drops migration FKs/indexes on boot)
      DATABASE_SYNCHRONIZE: "false"
      DATABASE_RUN_MIGRATIONS: ${DATABASE_RUN_MIGRATIONS:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3001
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # AI / Ollama — reaches the host machine's Ollama instance
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Qdrant (vector DB) for manual chunks
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # PDF OCR — binaries installed inside the container via apk, PATH is enough
      ENABLE_PDF_OCR: ${ENABLE_PDF_OCR:-true}
      PDFTOPPM_PATH: ${PDFTOPPM_PATH:-}
      TESSERACT_PATH: ${TESSERACT_PATH:-}
      TESSERACT_LANG: ${TESSERACT_LANG:-eng+fra}
      PDF_OCR_MAX_PAGES: ${PDF_OCR_MAX_PAGES:-10}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - smartmaint-network
    command: npm run start:dev

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartmaint-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - smartmaint-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  smartmaint-network:
    driver: bridge